[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    # uvicorn calls sys.exit() from its own thread when a port is already in
    # use. That is the path test_a_busy_port_is_reported_clearly asserts on, so
    # the resulting thread-exception warning is expected rather than a problem.
    ignore::pytest.PytestUnhandledThreadExceptionWarning
